name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded pull request checks without interrupting main branch runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build (${{ matrix.os }}, .NET ${{ matrix.dotnet }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        dotnet: ['8.0']

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET ${{ matrix.dotnet }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet }}.x

      - name: Restore
        run: dotnet restore Crontinel.sln

      - name: Build
        run: dotnet build Crontinel.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test Crontinel.sln --no-build --configuration Release --framework net${{ matrix.dotnet }}

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Crontinel.sln

      - name: Check formatting
        run: dotnet format Crontinel.sln --verify-no-changes --verbosity quiet
        continue-on-error: true
